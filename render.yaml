# Blueprint da Render: cria o serviço web do sistema (cardápio + painel) a partir deste repositório.
# Passo a passo e limites do plano gratuito: docs/DEPLOY.md
services:
  - type: web
    name: familia-massas
    runtime: docker
    plan: starter               # US$ 7/mês, 512 MB: o plano gratuito dorme e não serve para o conector do WhatsApp (D66)
    region: virginia            # a mais próxima do Brasil entre as da Render
    healthCheckPath: /api/cardapio
    autoDeployTrigger: commit   # cada push na main publica de novo
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: APP_KEY            # assina o link do WhatsApp; a Render sorteia
        generateValue: true
      - key: TRUST_PROXY        # a Render fica na frente do site: vale o IP do X-Forwarded-For
        value: "1"
      - key: DATABASE_URL       # connection string do Neon (Connect > Connection string). Com ela o sistema usa o Postgres e
        sync: false             # os dados, as sessões e as fotos sobrevivem a reinícios. Sem ela, usa o SQLite (disco temporário).
      - key: CONECTOR_SEGREDO   # senha entre o PHP e o conector do WhatsApp por QR code (a Render sorteia)
        generateValue: true
      # Para ligar o WhatsApp por QR code, crie também a variável WHATSAPP_CANAL = qr (veja docs/DEPLOY.md). Sem ela, o conector não sobe.
      - key: OPENROUTER_API_KEY # chave do OpenRouter (assistente com IA, D70/D71). Você digita no painel da Render; nunca vai para o banco.
        sync: false
      # iFood (D76, D82): o Client ID e o Client Secret do aplicativo são digitados na tela iFood do painel (o secret fica cifrado
      # no banco com a APP_KEY). IFOOD_CLIENT_ID e IFOOD_CLIENT_SECRET aqui são opcionais e, se existirem, valem primeiro.
      - key: SENHA_ADMIN_INICIAL        # você digita ao criar o serviço (8+ caracteres)
        sync: false
      - key: SENHA_ATENDENTE_INICIAL    # idem
        sync: false
      # Só sem Neon (SQLite em disco persistente, plano pago): troque "plan: free" por "plan: starter",
      # descomente o disco abaixo e a variável DATA_DIR.
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: dados
    #   mountPath: /var/data
    #   sizeGB: 1
