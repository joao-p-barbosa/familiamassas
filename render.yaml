# Blueprint da Render: cria o serviço web do sistema (cardápio + painel) a partir deste repositório.
# Passo a passo e limites do plano gratuito: docs/DEPLOY.md
services:
  - type: web
    name: familia-massas
    runtime: docker
    plan: free
    region: virginia            # a mais próxima do Brasil entre as da Render
    healthCheckPath: /api/cardapio
    autoDeployTrigger: commit   # cada push na main publica de novo
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: APP_KEY            # assina o link do WhatsApp; a Render sorteia
        generateValue: true
      - key: TRUST_PROXY        # a Render fica na frente do site: vale o IP do X-Forwarded-For
        value: "1"
      - key: DATABASE_URL       # connection string do Neon (Connect > Connection string). Com ela o sistema usa o Postgres e
        sync: false             # os dados, as sessões e as fotos sobrevivem a reinícios. Sem ela, usa o SQLite (disco temporário).
      - key: SENHA_ADMIN_INICIAL        # você digita ao criar o serviço (8+ caracteres)
        sync: false
      - key: SENHA_ATENDENTE_INICIAL    # idem
        sync: false
      # Só sem Neon (SQLite em disco persistente, plano pago): troque "plan: free" por "plan: starter",
      # descomente o disco abaixo e a variável DATA_DIR.
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: dados
    #   mountPath: /var/data
    #   sizeGB: 1
